<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div>
            <h1>Expense Tracker</h1>
            <p>Manage your expenses easily</p>
        </div>

        <button onclick="logout()">
            Logout
        </button>

    </header>


    <!-- Add / Edit Expense -->
    <main>

        <section class="expense-form">

            <h2>Add Expense</h2>

            <!-- Used internally when editing -->
            <input
                id="editId"
                type="hidden"
            >

            <div class="form-group">

                <input
                    id="title"
                    type="text"
                    placeholder="Expense title"
                >

                <input
                    id="amount"
                    type="number"
                    placeholder="Amount"
                    step="0.01"
                >

                <input
                    id="category"
                    type="text"
                    placeholder="Category"
                >

                <input
                    id="date"
                    type="date"
                >

                <input
                    id="description"
                    type="text"
                    placeholder="Description"
                >

            </div>

            <button
                id="addButton"
                onclick="handleAddExpense()"
            >
                Add Expense
            </button>

            <button
                onclick="clearExpenseForm()"
            >
                Clear
            </button>

        </section>


        <!-- Expenses -->
        <section class="expense-list">

            <div class="section-header">

                <h2>My Expenses</h2>

                <button onclick="loadExpenses()">
                    Refresh
                </button>

            </div>

            <div id="expenses"></div>

        </section>

    </main>


    <script src="script.js"></script>
    <script>
    if (!localStorage.getItem("token")) {
        window.location.href = "login.html";
    }
    </script>

</body>

</html>
