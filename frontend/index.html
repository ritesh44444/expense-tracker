<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div>
            <h1>Expense Tracker</h1>
            <p>Manage your money, one expense at a time.</p>
        </div>

        <button class="logout-button" onclick="logout()">
            Logout
        </button>
    </header>

    <main>

        <!-- Spending Summary -->
        <section class="summary-container">

            <div class="summary-card">
                <p class="summary-label">Total Spending</p>
                <h2 id="totalSpending">₹0.00</h2>
                <p class="summary-description">Across all your expenses</p>
            </div>

            <div class="summary-card">
                <p class="summary-label">This Month</p>
                <h2 id="monthlySpending">₹0.00</h2>
                <p class="summary-description">Spending in the current month</p>
            </div>

        </section>


        <!-- Add / Edit Expense -->
        <section class="panel expense-form">

            <div class="panel-heading">
                <div>
                    <h2 id="formHeading">Add Expense</h2>
                    <p>Record a new transaction.</p>
                </div>
            </div>

            <input id="editId" type="hidden">

            <form id="expenseForm">

                <div class="form-group">

                    <div class="input-group">
                        <label for="title">Expense title *</label>
                        <input
                            id="title"
                            type="text"
                            placeholder="e.g. Lunch"
                            maxlength="100"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="amount">Amount (₹) *</label>
                        <input
                            id="amount"
                            type="number"
                            placeholder="e.g. 250"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="category">Category *</label>
                        <input
                            id="category"
                            type="text"
                            placeholder="e.g. Food"
                            maxlength="50"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="date">Date *</label>
                        <input
                            id="date"
                            type="date"
                            required
                        >
                    </div>

                    <div class="input-group full-width">
                        <label for="description">Description</label>
                        <input
                            id="description"
                            type="text"
                            placeholder="Optional details"
                            maxlength="500"
                        >
                    </div>

                </div>

                <div class="form-actions">
                    <button id="addButton" type="submit" class="primary-button">
                        Add Expense
                    </button>

                    <button
                        id="clearButton"
                        type="button"
                        class="secondary-button"
                    >
                        Clear
                    </button>
                </div>

            </form>

        </section>


        <!-- Expense List -->
        <section class="panel expense-list">

            <div class="panel-heading list-heading">
                <div>
                    <h2>My Expenses</h2>
                    <p id="expenseCount">Loading expenses...</p>
                </div>

                <button
                    type="button"
                    id="refreshButton"
                    class="secondary-button"
                >
                    Refresh
                </button>
            </div>


            <!-- Filters -->
            <div class="filters">

                <div class="input-group">
                    <label for="categoryFilter">Category</label>

                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="startDate">From date</label>
                    <input type="date" id="startDate">
                </div>

                <div class="input-group">
                    <label for="endDate">To date</label>
                    <input type="date" id="endDate">
                </div>

                <div class="filter-actions">
                    <button
                        type="button"
                        id="applyFiltersButton"
                        class="primary-button"
                    >
                        Apply Filters
                    </button>

                    <button
                        type="button"
                        id="resetFiltersButton"
                        class="secondary-button"
                    >
                        Reset
                    </button>
                </div>

            </div>


            <!-- Expenses rendered by JavaScript -->
            <div id="expenses" aria-live="polite">
                <p>Loading expenses...</p>
            </div>

        </section>

    </main>


    <!-- Redirect if no token exists -->
    <script>
        if (!localStorage.getItem("token")) {
            window.location.replace("login.html");
        }
    </script>

    <script src="script.js"></script>

</body>
</html>
